<!DOCTYPE html>

<html lang="id"><head>

<style>
        /* Custom styles to hide default number input arrows if needed later, and general resets */
        input:focus { outline: none; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center relative p-margin-mobile md:p-margin-tablet">
<!-- Main Login Container -->
<main class="w-full max-w-sm flex flex-col items-center z-10">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined filled-icon text-on-primary-container" style="font-size: 36px;">point_of_sale</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">KasirKu</h1>
</div>
<!-- Greeting -->
<div class="text-center mb-lg w-full">
<h2 class="font-title-lg text-title-lg mb-xs">Selamat Datang</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun Anda</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">mail</span>
<input class="w-full h-12 pl-12 pr-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors focus:border-primary focus:ring-1 focus:ring-primary" id="email" placeholder="contoh@toko.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">lock</span>
<input class="w-full h-12 pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors focus:border-primary focus:ring-1 focus:ring-primary" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md text-outline hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full mt-[-8px]">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Lupa Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-sm bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-surface-tint active:scale-95 transition-all duration-200 shadow-sm" type="submit">
                Masuk
            </button>
</form>
</main>
<!-- Footer Versioning -->
<footer class="absolute bottom-lg text-center w-full">
<p class="font-label-md text-label-md text-outline-variant">KasirKu v1.0</p>
</footer>
<!-- Simple script for password visibility toggle -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
