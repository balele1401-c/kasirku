<!-- TopAppBar from JSON -->
<header class="w-full top-0 sticky border-b border-surface-variant dark:border-outline-variant bg-surface dark:bg-surface-dim flex items-center justify-between px-4 h-16 z-40">
<button class="p-2 -ml-2 text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:opacity-80 active:scale-95 duration-150 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim truncate">
            KasirKu
        </div>
<button class="p-2 -mr-2 text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:opacity-80 active:scale-95 duration-150 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full pb-[100px] flex flex-col">
<!-- Page Context Header (Since JSON TopAppBar is branded) -->
<div class="px-margin-mobile pt-lg pb-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Riwayat Transaksi</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Pantau aktivitas penjualan harian Anda.</p>
</div>
<!-- Filter Chips (Scrollable horizontally) -->
<div class="w-full overflow-x-auto no-scrollbar px-margin-mobile pb-md flex gap-sm items-center">
<!-- Active Chip -->
<button class="whitespace-nowrap px-4 py-2 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg transition-transform active:scale-95">
                Hari Ini
            </button>
<!-- Inactive Chips -->
<button class="whitespace-nowrap px-4 py-2 rounded-lg bg-surface border border-surface-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-low transition-colors active:scale-95">
                Minggu Ini
            </button>
<button class="whitespace-nowrap px-4 py-2 rounded-lg bg-surface border border-surface-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-low transition-colors active:scale-95">
                Bulan Ini
            </button>
</div>
<!-- Transaction List Group: Hari Ini -->
<div class="flex flex-col px-margin-mobile mt-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant mb-sm px-1">Hari Ini, 25 Okt 2023</h2>
<div class="flex flex-col gap-sm">
<!-- Transaction Card 1 -->
<div class="bg-surface border border-surface-variant rounded-xl p-md flex flex-col gap-sm active:bg-surface-container-low transition-colors cursor-pointer relative overflow-hidden group">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">14:35 - Kasir: Andi</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-xs">3 Item</span>
</div>
<div class="flex flex-col items-end">
<span class="font-title-lg text-title-lg text-primary">Rp 45.000</span>
</div>
</div>
<!-- Indicator/Affordance -->
<div class="absolute right-md top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Transaction Card 2 -->
<div class="bg-surface border border-surface-variant rounded-xl p-md flex flex-col gap-sm active:bg-surface-container-low transition-colors cursor-pointer relative overflow-hidden group">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">12:15 - Kasir: Budi</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-xs">1 Item</span>
</div>
<div class="flex flex-col items-end">
<span class="font-title-lg text-title-lg text-primary">Rp 15.000</span>
</div>
</div>
<div class="absolute right-md top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
</div>
<!-- Transaction List Group: Kemarin (Example for visual volume) -->
<div class="flex flex-col px-margin-mobile mt-lg">
<h2 class="font-label-lg text-label-lg text-on-surface-variant mb-sm px-1">Kemarin, 24 Okt 2023</h2>

<span class="font-body-md text-body-md text-on-surface-variant mt-xs">5 Item</span>
</div>
<div class="flex flex-col items-end">
<span class="font-title-lg text-title-lg text-primary">Rp 120.500</span>
</div>
</div>
<div class="absolute right-md top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>

<span class="material-symbols-outlined mb-1" data-icon="inventory_2">inventory_2</span>
