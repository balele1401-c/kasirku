<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tambah Produk Baru - KasirKu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#96f3e1",
                        "tertiary-fixed": "#62fae3",
                        "secondary-fixed-dim": "#7ad7c6",
                        "on-secondary-fixed-variant": "#005046",
                        "primary-container": "#008378",
                        "secondary": "#006b5e",
                        "outline": "#6d7a77",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadb",
                        "tertiary": "#00685c",
                        "on-tertiary-fixed": "#00201c",
                        "on-primary-fixed": "#00201d",
                        "inverse-on-surface": "#f0f1f2",
                        "primary": "#00685f",
                        "background": "#f8f9fa",
                        "secondary-container": "#96f3e1",
                        "tertiary-fixed-dim": "#3cddc7",
                        "surface": "#f8f9fa",
                        "on-background": "#191c1d",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#00201b",
                        "on-surface-variant": "#3d4947",
                        "primary-fixed": "#89f5e7",
                        "inverse-surface": "#2e3132",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#006a61",
                        "error": "#ba1a1a",
                        "inverse-primary": "#6bd8cb",
                        "tertiary-container": "#008375",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary-container": "#f4fffb",
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#6bd8cb",
                        "on-secondary-container": "#007164",
                        "surface-bright": "#f8f9fa",
                        "outline-variant": "#bcc9c6",
                        "on-primary-fixed-variant": "#005049",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#f4fffc",
                        "surface-container-highest": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#005047",
                        "surface-container-low": "#f3f4f5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "margin-tablet": "24px",
                        "base": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"],
                        "label-lg": ["Inter", "sans-serif"],
                        "title-lg": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Adapted for Task Intent) -->
<header class="w-full top-0 sticky bg-surface border-b border-surface-variant flex items-center justify-between px-4 h-16 z-40 transition-colors">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full active:opacity-80 active:scale-95 transition-all duration-150 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary flex-1 text-center pr-10">Tambah Produk Baru</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-2xl mx-auto px-margin-mobile md:px-margin-tablet py-lg pb-32">
<form class="flex flex-col gap-lg">
<!-- Image Upload Area -->
<div class="flex flex-col gap-sm">
<span class="font-label-lg text-label-lg text-on-surface-variant">Foto Produk</span>
<label class="w-full h-48 border-2 border-dashed border-outline-variant bg-surface-container-lowest rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="bg-primary-container/10 p-4 rounded-full mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="add_photo_alternate">add_photo_alternate</span>
</div>
<span class="font-body-md text-body-md text-primary">Unggah Foto</span>
<span class="font-label-md text-label-md text-outline mt-1">Maksimal 5MB (JPG, PNG)</span>
<input accept="image/*" class="hidden" type="file"/>
</label>
</div>
<!-- Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Nama Produk -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="nama_produk">Nama Produk</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-md py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md placeholder:text-outline/50" id="nama_produk" placeholder="Misal: Kopi Susu Aren" type="text"/>
</div>
<!-- Kategori -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="kategori">Kategori</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-md py-3 appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="kategori">
<option disabled="" selected="" value="">Pilih Kategori</option>
<option value="minuman">Minuman</option>
<option value="makanan">Makanan</option>
<option value="snack">Snack</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Harga Modal -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="harga_modal">Harga Modal</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-body-md text-outline">Rp</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-12 pr-md py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="harga_modal" placeholder="0" type="number"/>
</div>
</div>
<!-- Harga Jual -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="harga_jual">Harga Jual</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-body-md text-outline">Rp</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-12 pr-md py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="harga_jual" placeholder="0" type="number"/>
</div>
</div>
<!-- Stok Awal -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="stok_awal">Stok Awal</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-md py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="stok_awal" placeholder="0" type="number"/>
</div>
<!-- Batas Stok Rendah -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="batas_stok">Batas Stok Rendah</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-md py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="batas_stok" placeholder="5" type="number"/>
<p class="font-label-md text-label-md text-outline ml-1 mt-1">Notifikasi akan muncul saat stok mencapai batas ini.</p>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-variant p-margin-mobile md:p-margin-tablet pb-safe z-50 flex justify-center shadow-[0_-4px_16px_rgba(0,0,0,0.05)]">
<div class="w-full max-w-2xl">
<button class="w-full bg-primary hover:bg-tertiary active:bg-primary-container text-on-primary font-label-lg text-label-lg py-4 rounded-full transition-all duration-200 flex items-center justify-center gap-2 shadow-sm active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Simpan Produk
            </button>
</div>
</div>
</body></html>
